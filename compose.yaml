services:
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      WEBEX_BOT_TOKEN: ${WEBEX_BOT_TOKEN:-}
      ROUTER_USER: ${ROUTER_USER:-}
      ROUTER_PASS: ${ROUTER_PASS:-}
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 8000
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Quick Tunnel: publishes an HTTPS URL that forwards to webhook:8000.
  # Its hostname changes on every restart.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://webhook:8000
    ports:
      - "127.0.0.1:${METRICS_PORT:-2000}:2000"
    depends_on:
      - webhook
    restart: unless-stopped

  # Keeps the two Webex registrations pointed at whatever URL the
  # tunnel currently holds, so a tunnel restart does not silence the bot.
  registrar:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/update_webex_webhooks.py", "--watch"]
    environment:
      WEBEX_BOT_TOKEN: ${WEBEX_BOT_TOKEN:-}
      TUNNEL_METRICS_URL: http://tunnel:2000
    volumes:
      - ./scripts:/opt/ipa2026/scripts:ro
    depends_on:
      - tunnel
    restart: unless-stopped
